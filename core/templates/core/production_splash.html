{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DuckProject</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'core/brand/duckproject-square-color.svg' %}">
    <link rel="preload" href="{% static 'core/fonts/outfit-800.ttf' %}" as="font" type="font/ttf" crossorigin>
    <style>
        @font-face {
            font-family: 'Outfit'; font-style: normal; font-weight: 800;
            font-display: swap;
            src: url("{% static 'core/fonts/outfit-800.ttf' %}") format('truetype');
        }
        * { box-sizing: border-box; }
        html { background: #090909; color: #fff; }
        body { margin: 0; }
        ::selection { background: #fff; color: #090909; }
        main {
            min-height: 100vh; min-height: 100svh;
            display: flex; align-items: center;
            padding: 32px 10.4vw;
        }
        h1 {
            margin: 0; font: 800 56px/1.18 'Outfit', sans-serif;
            letter-spacing: -0.025em;
        }
        .word { display: block; position: relative; width: max-content; }
        .measure { visibility: hidden; }
        .typed { position: absolute; inset: 0; white-space: nowrap; }
        .cursor {
            display: inline-block; width: 3px; height: 1.3em;
            margin-left: 0.22em; vertical-align: -0.22em;
            background: currentColor;
            animation: blink 1.1s step-end infinite;
        }
        .cursor[hidden] { display: none; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @media (max-width: 600px) {
            main { padding-inline: clamp(24px, 16vw, 60px); }
            h1 { font-size: clamp(32px, 15vw, 56px); }
        }
        @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
    <script src="{% static 'core/production-splash.js' %}" defer></script>
</head>
<body>
    <main>
        <h1 aria-label="Duck Project">
            <span class="word"><span class="measure" aria-hidden="true">DUCK</span><span class="typed" aria-hidden="true"><span data-typewriter-word>DUCK</span><span class="cursor" hidden></span></span></span>
            <span class="word"><span class="measure" aria-hidden="true">PROJECT</span><span class="typed" aria-hidden="true"><span data-typewriter-word>PROJECT</span><span class="cursor"></span></span></span>
        </h1>
    </main>
</body>
</html>
